<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | ProudeWear</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <a href="../index.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
          <img src="../images/logo.png" alt="Proude Wear" style="height: 32px; width: auto; object-fit: contain;">
          <span class="badge">Admin</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li><a href="#" class="active"><i class="fas fa-box"></i> Products</a></li>
          <li><a href="#"><i class="fas fa-shopping-cart"></i> Orders (Demo)</a></li>
          <li><a href="#"><i class="fas fa-users"></i> Customers (Demo)</a></li>
          <li><a href="../index.html"><i class="fas fa-store"></i> View Store</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <header class="admin-header">
        <h1>Product Management</h1>
        <button class="btn btn-primary" id="addProductBtn"><i class="fas fa-plus"></i> Add New Product</button>
      </header>

      <!-- Dashboard Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-tags"></i></div>
          <div class="stat-info">
            <h3 id="totalProducts">0</h3>
            <p>Total Products</p>
          </div>
        </div>
      </div>

      <!-- Products Table -->
      <div class="table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>ID</th>
              <th>Title</th>
              <th>Price</th>
              <th>Category/Fabric</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="productTableBody">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add/Edit Product Modal -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add New Product</h2>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>
      <form id="productForm">
        <input type="hidden" id="editProductId">
        
        <div class="form-row">
          <div class="form-group">
            <label for="productId">Product ID (e.g., BL-313)</label>
            <input type="text" id="productId" required>
          </div>
          <div class="form-group">
            <label for="productTitle">Title</label>
            <input type="text" id="productTitle" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="productPrice">Price (₹)</label>
            <input type="number" id="productPrice" required>
          </div>
          <div class="form-group">
            <label for="productOriginalPrice">Original Price (₹)</label>
            <input type="number" id="productOriginalPrice">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="productFabric">Fabric</label>
            <select id="productFabric">
              <option value="Silk">Silk</option>
              <option value="Banarasi">Banarasi</option>
              <option value="Georgette">Georgette</option>
              <option value="Chiffon">Chiffon</option>
              <option value="Cotton">Cotton</option>
              <option value="Designer">Designer</option>
            </select>
          </div>
          <div class="form-group">
            <label for="productNeckline">Neckline</label>
            <select id="productNeckline">
              <option value="Sweetheart">Sweetheart</option>
              <option value="Boat Neck">Boat Neck</option>
              <option value="V-Neck">V-Neck</option>
              <option value="Round Neck">Round Neck</option>
              <option value="Square Neck">Square Neck</option>
              <option value="Halter">Halter</option>
              <option value="High Neck">High Neck</option>
              <option value="Keyhole">Keyhole</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="productImage">Image URL</label>
            <input type="url" id="productImage" placeholder="https://images.unsplash.com/..." required>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Include shared products data script -->
  <script src="../products.js"></script>
  <script src="admin.js"></script>
</body>
</html>
